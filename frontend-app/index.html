<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight On Time - Predicción de Vuelos</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-animation"></div>

    <main class="container">
        <div class="glass-card">
            <header>
                <h1>Flight On Time</h1>
                <p>Predice la puntualidad de tu próximo vuelo</p>
            </header>

            <form id="predictionForm">
                <div class="form-group">
                    <label for="aerolinea">Aerolínea</label>
                    <select id="aerolinea" name="aerolinea" required>
                        <option value="">Selecciona una aerolínea</option>
                        <!-- Se llena con JS -->
                    </select>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="origen">Origen</label>
                        <select id="origen" name="origen" required>
                            <option value="">Origen</option>
                            <!-- Se llena con JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="destino">Destino</label>
                        <select id="destino" name="destino" required>
                            <option value="">Destino</option>
                            <!-- Se llena con JS -->
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="hora">Hora</label>
                        <input type="time" id="hora" name="hora" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="distancia_km">Distancia (km)</label>
                    <label id="valor_distancia_km"></label>
                    <input type="hidden" id="distancia_km" name="distancia_km" placeholder="Ej: 1142" required min="1" disabled>
                </div>

                <button type="submit" class="cta-button">
                    <span>Predecir Vuelo</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Modal de Resultados -->
    <div id="resultModal" class="modal hidden">
        <div class="modal-content glass-card">
            <span class="close-button">&times;</span>
            <div id="modalBody">
                <h2 id="predictionTitle">Analizando...</h2>
                
                <div class="result-display hidden" id="resultDisplay">
                    <p class="prediction-text">Previsión: <strong id="predictionValue">-</strong></p>
                    
                    <div class="progress-container">
                        <div class="progress-bar" id="probabilityBar"></div>
                    </div>
                    <p class="probability-text">Probabilidad: <span id="probabilityValue">0</span>%</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
